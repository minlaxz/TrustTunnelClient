name: Deploy Windows library

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.2.3). If omitted, the version comes from git describe."
        required: false
        type: string
      ref:
        description: "Git ref (SHA or branch) to build from. If omitted, uses the default checkout."
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version override (e.g. 1.2.3). If omitted, the version comes from git describe."
        required: false
        type: string
      ref:
        description: "Git ref (SHA or branch) to build from. If omitted, uses the default checkout."
        required: false
        type: string

jobs:
  resolve-images:
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-client'
    uses: AdGuardSoftwareLimited/native-libs-common/.github/workflows/resolve-images.yml@master

  deploy-windows:
    name: Deploy library / Windows
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-client'
    needs: [resolve-images]
    environment: windows-gh-packages
    runs-on:
      - ephemeral
      - ephemeral-vmwin
      - ${{ needs.resolve-images.outputs.windows }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          # Full history + tags so git describe can resolve the version.
          fetch-depth: 0

      - name: Retrieve Windows signing secrets
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          role: trusttunnel-windows-signing
          secrets: |
            secret/data/ci-secrets/trusttunnel-windows-signing trustTunnelWinSignerSecretApiKey | SIGNER_API_KEY

      - name: Configure Conan
        env:
          CONAN_REPO_URL: ${{ vars.CONAN_REPO_URL }}
        run: |
          & conan remote add --index 0 art $Env:CONAN_REPO_URL
        shell: powershell

      - name: Detect version
        id: version
        shell: powershell
        run: |
          if ('${{ inputs.version }}' -ne '') {
            $VERSION = '${{ inputs.version }}'
          } else {
            $VERSION = git describe --tags --match 'v*'
            $VERSION = $VERSION -replace '^v', ''
          }
          if (!$VERSION) { throw 'Failed to detect VERSION via git describe' }
          "version=$VERSION" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Build and publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNER_URL: ${{ vars.SIGNER_URL }}
          ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
          TOKEN: ${{ secrets.PUBLIC_REPO_GPR_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $repository = 'TrustTunnel/TrustTunnelClient'
          $wintunVersion = (Get-Content third-party\wintun\VERSION).Trim()
          $wintunUrl = "$Env:ARTIFACTORY_URL/adguard-pods/binaries/wintun-$wintunVersion.zip"

          foreach ($arch in @('x86_64', 'i686', 'aarch64')) {
            Write-Host "=== Building and publishing $arch ===" -ForegroundColor Cyan
            & platform\windows\scripts\build_package.ps1 `
              -Arch $arch `
              -Version $Env:VERSION `
              -WintunUrl $wintunUrl `
              -Sign
            if (!$?) { throw "build_package.ps1 failed for $arch" }

            & platform\windows\scripts\publish_maven.ps1 `
              -Arch $arch `
              -Version $Env:VERSION `
              -Repository $repository
            if (!$?) { throw "publish_maven.ps1 failed for $arch" }
          }
        shell: powershell
