[package]
name = "trusttunnel-subscription"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib"]

[dependencies]
base64 = "0.21"
percent-encoding = "2"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-pemfile = "1.0"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0"
trusttunnel-settings = { path = "../settings" }
ureq = { version = "=2.9.1", default-features = false, features = ["tls"] }
url = "=2.5.0"
webpki-roots = "0.25"
time = { version = "0.3", features = ["formatting"] }
toml = "0.7.4"
toml_edit = "0.19.10"
